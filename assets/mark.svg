<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-labelledby="t d"><title id="t">Context flow</title><desc id="d">A parent context branches into inherited and isolated tasks.</desc><rect x="8" y="8" width="224" height="164" rx="22" fill="#101827"/><rect x="76" y="22" width="88" height="34" rx="10" fill="#0f766e" stroke="#5eead4"/><text x="120" y="44" text-anchor="middle" fill="#ecfeff" font-family="sans-serif" font-size="13">parent</text><path d="M120 56 V78 M120 78 H58 V98 M120 78 H182 V98" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/><rect x="22" y="98" width="72" height="42" rx="10" fill="#164e63" stroke="#67e8f9"/><rect x="146" y="98" width="72" height="42" rx="10" fill="#334155" stroke="#94a3b8"/><text x="58" y="116" text-anchor="middle" fill="#ecfeff" font-family="sans-serif" font-size="10">inherited</text><text x="58" y="130" text-anchor="middle" fill="#a5f3fc" font-family="sans-serif" font-size="9">snapshot</text><text x="182" y="116" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="10">isolated</text><text x="182" y="130" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="9">empty context</text><circle cx="120" cy="78" r="5" fill="#5eead4"/></svg>