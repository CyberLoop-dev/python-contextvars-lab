[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-contextvars-lab"
version = "1.0.0"
description = "A small CLI lab for asyncio context variable propagation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
contextvars-lab = "contextvars_lab:main"

[tool.setuptools]
py-modules = ["contextvars_lab"]
